---
name: CI

on:
  pull_request:
    branches:
      - dev
      - main

  push:
    branches:
      - dev
      - main

jobs:
  test:
    name: Tests

    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - run: |
          python -m venv venv
          venv/bin/pip install -r requirements_test.txt
          venv/bin/pytest tests/

  # Branch protection still requires these job names. They only report success;
  # Python 3.9/3.10 are no longer tested. Remove once the required checks are updated.
  retired-python:
    name: Tests (${{ matrix.python-version }})

    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version:
          - "3.9"
          - "3.10"

    steps:
      - run: echo "Python ${{ matrix.python-version }} is no longer supported."

  coverage:

    name: Test Coverage

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - run: |
          python -m venv venv
          venv/bin/pip install -r requirements_test.txt
          venv/bin/pytest \
            -s \
            --verbose \
            --cov-report term-missing \
            --cov-report xml \
            --cov=aioflo tests

      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:

    name: "Linting & Static Analysis"

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: pre-commit/action@v3.0.1
        env:
          SKIP: no-commit-to-branch
